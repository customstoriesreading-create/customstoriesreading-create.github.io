<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>UVC Snipping Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0f1115;
      color: #e6e8eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      height: 48px;
      background: #181b21;
      border-bottom: 1px solid #2b303b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 10px;
      flex-shrink: 0;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select, button {
      background: #232733;
      color: #e6e8eb;
      border: 1px solid #3d4455;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    select:focus, button:focus {
      border-color: #3b82f6;
    }

    button:active {
      background: #2e3444;
    }

    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }

    button.primary:active {
      background: #1d4ed8;
    }

    button.active {
      background: #059669;
      border-color: #10b981;
    }

    /* Status Marker */
    #status-marker {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #status-marker.success {
      background: #064e3b;
      border-color: #059669;
      color: #6ee7b7;
    }

    /* Stream and Canvas Wrapper */
    #viewer-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Interactive Snipping Overlay Canvas */
    #snip-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* Bottom Action Toolbar */
    #bottom-bar {
      height: 52px;
      background: #181b21;
      border-top: 1px solid #2b303b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
      padding: 0 12px;
    }

    .hint-text {
      position: absolute;
      bottom: 60px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #cbd5e1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <header>
    <div class="header-left">
      <select id="video-select">
        <option value="">Detecting capture card...</option>
      </select>
      <button id="btn-refresh">Reload Feed</button>
    </div>

    <div class="header-right">
      <div id="status-marker">Idle</div>
    </div>
  </header>

  <!-- Video + Snipping Area -->
  <div id="viewer-container">
    <video id="video-stream" autoplay playsinline muted></video>
    <canvas id="snip-canvas"></canvas>
    <div id="guide-hint" class="hint-text">Drag mouse to select region | Click 'Copy Snip' or 'Full Frame'</div>
  </div>

  <!-- Bottom Snip Controls -->
  <div id="bottom-bar">
    <button id="btn-full-frame">Capture Full Frame</button>
    <button id="btn-copy-snip" class="primary" disabled>Copy Snip to Clipboard</button>
    <button id="btn-clear-snip">Clear Selection</button>
  </div>

  <script>
    const video = document.getElementById('video-stream');
    const canvas = document.getElementById('snip-canvas');
    const ctx = canvas.getContext('2d');
    const videoSelect = document.getElementById('video-select');
    const refreshBtn = document.getElementById('btn-refresh');
    const copySnipBtn = document.getElementById('btn-copy-snip');
    const fullFrameBtn = document.getElementById('btn-full-frame');
    const clearSnipBtn = document.getElementById('btn-clear-snip');
    const statusMarker = document.getElementById('status-marker');

    let currentStream = null;
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let cropRect = null; // { x, y, width, height } in canvas pixels

    // Resize canvas overlay to match container element exactly
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      drawOverlay();
    }
    window.addEventListener('resize', resizeCanvas);

    // Initialize Devices (Audio completely omitted)
    async function initDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');

        videoSelect.innerHTML = '';
        if (videoDevices.length === 0) {
          videoSelect.innerHTML = '<option>No Capture Card Detected</option>';
          return;
        }

        videoDevices.forEach((dev, index) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          opt.textContent = dev.label || `Video Source ${index + 1}`;
          videoSelect.appendChild(opt);
        });

        // External UVC capture dongles typically register as the last device
        startStream(videoDevices[videoDevices.length - 1].deviceId);
      } catch (err) {
        showMarker("Camera permission denied", false);
      }
    }

    async function startStream(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = currentStream;
        video.onloadedmetadata = () => {
          resizeCanvas();
          showMarker("Feed Ready", false);
        };
      } catch (err) {
        showMarker("Stream error", false);
      }
    }

    videoSelect.addEventListener('change', () => startStream(videoSelect.value));
    refreshBtn.addEventListener('click', () => startStream(videoSelect.value));

    // Calculate actual displayed video bounds within object-fit: contain
    function getVideoRenderBounds() {
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const cWidth = canvas.width;
      const cHeight = canvas.height;

      if (!vWidth || !vHeight) return null;

      const videoRatio = vWidth / vHeight;
      const containerRatio = cWidth / cHeight;

      let rWidth, rHeight, rX, rY;

      if (containerRatio > videoRatio) {
        rHeight = cHeight;
        rWidth = cHeight * videoRatio;
        rX = (cWidth - rWidth) / 2;
        rY = 0;
      } else {
        rWidth = cWidth;
        rHeight = cWidth / videoRatio;
        rX = 0;
        rY = (cHeight - rHeight) / 2;
      }

      return {
        left: rX,
        top: rY,
        width: rWidth,
        height: rHeight,
        videoWidth: vWidth,
        videoHeight: vHeight,
        scaleX: vWidth / rWidth,
        scaleY: vHeight / rHeight
      };
    }

    // Render snipping box & dimmed backdrop
    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!cropRect || cropRect.width <= 0 || cropRect.height <= 0) return;

      // Darken unselected area
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clear the selected viewport
      ctx.clearRect(cropRect.x, cropRect.y, cropRect.width, cropRect.height);

      // Draw dashed selection border
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(cropRect.x, cropRect.y, cropRect.width, cropRect.height);
      ctx.setLineDash([]);
    }

    // Pointer events for snipping
    function handlePointerDown(e) {
      const rect = canvas.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;
      isDrawing = true;
      cropRect = null;
      copySnipBtn.disabled = true;
      drawOverlay();
    }

    function handlePointerMove(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const currentX = e.clientX - rect.left;
      const currentY = e.clientY - rect.top;

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY); 
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);

      cropRect = { x, y, width, height };
      drawOverlay();
    }

    function handlePointerUp() {
      if (!isDrawing) return;
      isDrawing = false;
      if (cropRect && cropRect.width > 10 && cropRect.height > 10) {
        copySnipBtn.disabled = false;
      } else {
        cropRect = null;
        copySnipBtn.disabled = true;
        drawOverlay();
      }
    }

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);

    // Clear Snip
    clearSnipBtn.addEventListener('click', () => {
      cropRect = null;
      copySnipBtn.disabled = true;
      drawOverlay();
    });

    // Copy Snip to Clipboard
    copySnipBtn.addEventListener('click', async () => {
      if (!cropRect) return;
      const bounds = getVideoRenderBounds();
      if (!bounds) return;

      // Intersect selection box with actual video display coordinates
      const intersectX = Math.max(cropRect.x, bounds.left);
      const intersectY = Math.max(cropRect.y, bounds.top);
      const intersectRight = Math.min(cropRect.x + cropRect.width, bounds.left + bounds.width);
      const intersectBottom = Math.min(cropRect.y + cropRect.height, bounds.top + bounds.height);

      const selW = intersectRight - intersectX;
      const selH = intersectBottom - intersectY;

      if (selW <= 0 || selH <= 0) {
        showMarker("Selection outside video", false);
        return;
      }

      // Convert from screen CSS pixels to original source video pixel coords
      const sourceX = (intersectX - bounds.left) * bounds.scaleX;
      const sourceY = (intersectY - bounds.top) * bounds.scaleY;
      const sourceW = selW * bounds.scaleX;
      const sourceH = selH * bounds.scaleY;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = sourceW;
      offCanvas.height = sourceH;
      const offCtx = offCanvas.getContext('2d');

      offCtx.drawImage(
        video,
        sourceX, sourceY, sourceW, sourceH,
        0, 0, sourceW, sourceH
      );

      writeCanvasToClipboard(offCanvas, "Snip Copied! (⌘V)");
    });

    // Copy Full Frame to Clipboard
    fullFrameBtn.addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) return;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = video.videoWidth;
      offCanvas.height = video.videoHeight;
      const offCtx = offCanvas.getContext('2d');

      offCtx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
      writeCanvasToClipboard(offCanvas, "Full Frame Copied! (⌘V)");
    });
    
// Native clipboard writer (iOS/iPadOS Safari & Chrome compatible)
async function writeCanvasToClipboard(targetCanvas, successMessage) {
  try {
    // 1. Wrap the blob conversion in a Promise
    const blobPromise = new Promise((resolve, reject) => {
      targetCanvas.toBlob((blob) => {
        if (blob) resolve(blob);
        else reject(new Error("Canvas blob conversion failed"));
      }, 'image/png');
    });

    // 2. Pass the Promise directly into ClipboardItem synchronously inside the event chain
    const item = new ClipboardItem({
      'image/png': blobPromise
    });

    await navigator.clipboard.write([item]);
    showMarker(successMessage, true);
  } catch (err) {
    console.error("Clipboard error:", err);
    // Fallback if the browser still denies async write permissions
    fallbackDownloadOrPreview(targetCanvas, successMessage);
  }
}

// Fallback helper in case iOS blocks programmatic clipboard access
function fallbackDownloadOrPreview(targetCanvas, label) {
  targetCanvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    
    // Open image directly in a new tab so you can long-press -> "Copy Image" / "Save to Photos"
    const win = window.open(url, '_blank');
    if (win) {
      showMarker("Opened in tab: tap & hold to copy", true);
    } else {
      // Trigger instant direct download if pop-up was blocked
      const a = document.createElement('a');
      a.href = url;
      a.download = `capture-${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url);
      showMarker("Downloaded PNG", true);
    }
  }, 'image/png');
}

    function showMarker(text, isSuccess) {
      statusMarker.textContent = text;
      if (isSuccess) {
        statusMarker.className = "success";
      } else {
        statusMarker.className = "";
      }
    }

    // Boot
    initDevices();
  </script>
</body>
</html>
